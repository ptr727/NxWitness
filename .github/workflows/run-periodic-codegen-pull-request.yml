name: Run daily codegen and pull request action

# Thin caller: the codegen cycle is the hub's reusable run-codegen-pull-request-task.yml, which every fleet repo generating checked-in files from an external source reaches rather than carries.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

# Workflow-only group (no -${{ github.ref }}): the task writes to the fixed codegen-main/codegen-develop branches regardless of the triggering ref, so a dispatch and the scheduled run must not race on them.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:

  run-codegen:
    name: Run codegen and pull request job
    uses: ptr727/ProjectTemplate/.github/workflows/run-codegen-pull-request-task.yml@904096552cea4192d7a1c4db88a347fbb18272e9 # 2.0.718
    secrets:
      CODEGEN_APP_CLIENT_ID: ${{ secrets.CODEGEN_APP_CLIENT_ID }}
      CODEGEN_APP_PRIVATE_KEY: ${{ secrets.CODEGEN_APP_PRIVATE_KEY }}
