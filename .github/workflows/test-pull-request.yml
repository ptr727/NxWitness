name: Test pull request action

# CI for every pull request, plus a push to develop and a manual dispatch.
# The validate job (unit tests + lint) runs on every run.
# The image smoke build runs only when image files changed, through the inline git diff change-gate.
# A full product smoke is heavier than a doc-only change warrants.
# CI never publishes, since the publisher runs on schedule, on the Make/Matrix.json push, and on dispatch.
# Only a pull_request run takes the ruleset-bound check name, per WORKFLOW.md D1.5.

on:
  pull_request:
  # A push to develop re-validates the merged tree, under the aggregator's non-required name.
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Deny by default: every job below grants only what its own steps need.
# A job added later inherits nothing rather than the repository default, which is write on this repo.
permissions: {}

jobs:

  # Inline change-gate (no third-party action): diff the change to decide whether the image smoke build is needed.
  # A pull request diffs its head against its merge base with the base branch, and a push diffs against its before-commit.
  # The image output is set when any Docker/Matrix/Version file, Docker hook, or workflow changed.
  # The workflows count because a hub pin bump changes tasks a pull request otherwise never exercises.
  # The base output is set when a base Dockerfile or the base hook changed.
  # On a dispatch or a new branch (no before-commit), build everything.
  # The !github.event.deleted guard skips a develop deletion push, whose github.sha reverts to the default branch's tip.
  changes:
    name: Detect image changes job
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.filter.outputs.image }}
      base: ${{ steps.filter.outputs.base }}
    steps:

      - name: Checkout step
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Filter changed paths step
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          # A dispatch or a new branch has no usable before-commit (all-zeros or empty), so build everything.
          if [[ "$BEFORE" =~ ^0+$ || -z "$BEFORE" || "$EVENT" == "workflow_dispatch" ]]; then
            echo "image=true" >> "$GITHUB_OUTPUT"
            echo "base=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A pull request reads the three-dot range, so a base branch that moved on adds none of its own changes.
          RANGE="$BEFORE..$AFTER"
          [[ "$EVENT" == "pull_request" ]] && RANGE="$BEFORE...$AFTER"
          if ! DIFF=$(git diff --name-only "$RANGE" 2>/dev/null); then
            # BEFORE is not in the fetched history (e.g. a force-push that rewrote it). Build everything.
            echo "image=true" >> "$GITHUB_OUTPUT"
            echo "base=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qE '^(Docker/|Make/Matrix\.json$|Make/Version\.json$|\.github/actions/docker-|\.github/workflows/)' <<<"$DIFF"; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^(Docker/(NxBase\.Dockerfile|NxBase-LSIO\.Dockerfile)$|\.github/actions/docker-build-base/)' <<<"$DIFF"; then
            echo "base=true" >> "$GITHUB_OUTPUT"
          else
            echo "base=false" >> "$GITHUB_OUTPUT"
          fi

  # The hub's reusable gate, the same one the publisher runs, so the push gate and the publish gate are identical.
  validate:
    name: Validate job
    if: ${{ !github.event.deleted }}
    uses: ptr727/ProjectTemplate/.github/workflows/validate-task.yml@9afb02a85c5a2fd59806e5c7fa5d7bf964d56e7a # 2.0.1401
    permissions:
      contents: read
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Fast smoke build in place of the full matrix, only when image files changed, through the hub's release chain with smoke set, which never pushes.
  # It builds one NxMeta and one NxMeta-LSIO row on amd64, the image input naming them as the docker-prepare hook's filter.
  # The base images build first only when a base Dockerfile changed, and otherwise the product smoke pulls the published base from Docker Hub.
  # It needs validate with no always() in its if, so an unsuccessful validate skips it through the implicit needs-success rule.
  # The Docker Hub secrets are mapped even on smoke, since the hub task logs in on every build for the higher rate limit.
  smoke-build:
    name: Smoke build job
    needs: [changes, validate]
    if: ${{ !github.event.deleted && needs.changes.outputs.image == 'true' }}
    uses: ptr727/ProjectTemplate/.github/workflows/build-release-task.yml@9afb02a85c5a2fd59806e5c7fa5d7bf964d56e7a # 2.0.1401
    permissions:
      contents: read
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
    with:
      smoke: true
      github: false
      dockerhub: false
      enable_docker: true
      enable_dotnet_publish: false
      enable_nuget: false
      enable_pypi: false
      expect_release_assets: false
      docker_image: NxMeta,NxMeta-LSIO
      docker_build_base: ${{ needs.changes.outputs.base == 'true' }}
      # Map the run to a Make/Matrix.json Branch value: a pull request into main checks main's rows.
      # A pull_request run's github.ref_name is the PR ref (for example 123/merge), so base_ref is read first.
      # Every other branch falls back to develop's rows, since a feature branch name matches no row.
      branch: ${{ (github.base_ref || github.ref_name) == 'main' && 'main' || 'develop' }}

  # Single required status check, whose pull_request name is the ruleset-bound context in the live branch ruleset.
  # Do not rename it without updating the ruleset in lockstep.
  # Only a pull_request run takes that name, so a push or dispatch run on a PR's head cannot post it without the PR run's gates.
  # Skips on a branch deletion, when the other jobs also skip, so the deletion push does not fail it.
  check-workflow-status:
    name: ${{ github.event_name == 'pull_request' && 'Check pull request workflow status job' || 'Check workflow status job' }}
    runs-on: ubuntu-latest
    permissions: {}
    needs: [changes, validate, smoke-build]
    if: ${{ always() && !github.event.deleted }}
    steps:
      - name: Check workflow results step
        run: |
          set -Eeuo pipefail
          exit_on_result() {
            # Pass on success or skipped (smoke-build is skipped when no image files changed). Fail only on
            # failure/cancelled.
            if [[ "$2" == "failure" || "$2" == "cancelled" ]]; then
              echo "::error::Job '$1' failed or was cancelled."
              exit 1
            fi
          }
          # changes must succeed: if it fails, smoke-build is skipped (not run), and treating that skip as a
          # pass would let an image-changing PR merge without the smoke build.
          exit_on_result "changes" "${{ needs.changes.result }}"
          exit_on_result "validate" "${{ needs.validate.result }}"
          exit_on_result "smoke-build" "${{ needs.smoke-build.result }}"
